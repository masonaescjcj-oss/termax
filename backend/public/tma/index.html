<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trade Hub TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --tg-theme-bg-color: #000000;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #3b82f6;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-gradient {
            background: linear-gradient(90deg, #60A5FA, #A855F7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .price-up { color: #10B981; }
        .price-down { color: #EF4444; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 10px;
            gap: 4px;
        }
        .nav-item.active {
            color: #3b82f6;
        }
        .nav-item i {
            font-size: 20px;
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <header class="px-4 pt-4 pb-2 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur z-40 border-b border-white/10">
        <div>
            <h1 class="text-xl font-bold text-gradient">Trade Hub</h1>
            <p class="text-xs text-gray-400" id="userName">Welcome back</p>
        </div>
        <div class="flex items-center gap-2 glass-btn px-3 py-1.5 rounded-full">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-xs font-medium">Live</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4">
        
        <!-- Balance Card -->
        <div class="glass-panel p-5 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
            <p class="text-sm text-gray-400 mb-1">Total Balance (Demo)</p>
            <h2 class="text-3xl font-bold mb-4">$10,000.00</h2>
            
            <div class="flex gap-3">
                <button class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-medium transition-colors" onclick="WebApp.showAlert('Deposit not available in Demo')">
                    Deposit
                </button>
                <button class="flex-1 glass-btn text-white py-2.5 rounded-xl font-medium transition-colors" onclick="WebApp.showAlert('Withdraw not available in Demo')">
                    Withdraw
                </button>
            </div>
        </div>

        <!-- Watchlist -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold">Watchlist</h3>
                <span class="text-xs text-blue-400">See All</span>
            </div>
            
            <div class="space-y-3" id="watchlistContainer">
                <!-- Items injected by JS -->
                <div class="glass-panel p-3 flex justify-between items-center animate-pulse">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white/10"></div>
                        <div>
                            <div class="w-16 h-4 bg-white/10 rounded mb-2"></div>
                            <div class="w-10 h-3 bg-white/10 rounded"></div>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-3 flex justify-between items-center animate-pulse">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white/10"></div>
                        <div>
                            <div class="w-16 h-4 bg-white/10 rounded mb-2"></div>
                            <div class="w-10 h-3 bg-white/10 rounded"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div>
            <h3 class="text-lg font-semibold mb-3">Pro Tools</h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="glass-panel p-4 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform" onclick="WebApp.showAlert('Opening AI Coach...')">
                    <div class="w-12 h-12 rounded-full bg-purple-500/20 flex items-center justify-center text-purple-400">
                        <i class="fa-solid fa-robot text-xl"></i>
                    </div>
                    <span class="text-sm font-medium">AI Coach</span>
                </div>
                <div class="glass-panel p-4 flex flex-col items-center justify-center gap-2 active:scale-95 transition-transform" onclick="WebApp.showAlert('Opening Signals...')">
                    <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
                        <i class="fa-solid fa-bolt text-xl"></i>
                    </div>
                    <span class="text-sm font-medium">Live Signals</span>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-chart-line"></i>
            <span>Trade</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-layer-group"></i>
            <span>Positions</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-compass"></i>
            <span>Discover</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </div>
    </nav>

    <script>
        const WebApp = window.Telegram.WebApp;
        
        // Initialize TMA
        WebApp.ready();
        WebApp.expand(); // Expand to full height
        WebApp.setHeaderColor('#000000');
        WebApp.setBackgroundColor('#000000');

        // Set user name if available
        if (WebApp.initDataUnsafe && WebApp.initDataUnsafe.user) {
            document.getElementById('userName').textContent = `Hello, ${WebApp.initDataUnsafe.user.first_name}`;
        }

        // Mock data for Watchlist
        const mockData = [
            { symbol: 'BTC/USDT', name: 'Bitcoin', price: '64,230.50', change: '+2.4%', up: true, icon: 'fa-brands fa-bitcoin', color: 'text-orange-400' },
            { symbol: 'ETH/USDT', name: 'Ethereum', price: '3,420.15', change: '-0.8%', up: false, icon: 'fa-brands fa-ethereum', color: 'text-purple-400' },
            { symbol: 'SOL/USDT', name: 'Solana', price: '145.20', change: '+5.1%', up: true, icon: 'fa-solid fa-sun', color: 'text-green-400' },
            { symbol: 'GOLD', name: 'XAU/USD', price: '2,340.80', change: '+0.2%', up: true, icon: 'fa-solid fa-coins', color: 'text-yellow-400' }
        ];

        // Render Watchlist
        function renderWatchlist() {
            const container = document.getElementById('watchlistContainer');
            container.innerHTML = '';
            
            mockData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'glass-panel p-3 flex justify-between items-center active:bg-white/5 transition-colors';
                el.onclick = () => WebApp.showAlert(`Opening chart for ${item.symbol}`);
                
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center ${item.color}">
                            <i class="${item.icon} text-lg"></i>
                        </div>
                        <div>
                            <div class="font-bold text-sm">${item.symbol}</div>
                            <div class="text-xs text-gray-400">${item.name}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-sm">$${item.price}</div>
                        <div class="text-xs ${item.up ? 'price-up' : 'price-down'} font-medium">
                            ${item.up ? '▲' : '▼'} ${item.change}
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // Render after a small delay to simulate loading
        setTimeout(renderWatchlist, 800);

        // Setup Main Button
        WebApp.MainButton.text = "OPEN NEW POSITION";
        WebApp.MainButton.color = "#3b82f6";
        WebApp.MainButton.show();
        WebApp.MainButton.onClick(() => {
            WebApp.showAlert("Opening order panel...");
        });
        
        // Haptic feedback
        document.querySelectorAll('.glass-panel, button, .nav-item').forEach(el => {
            el.addEventListener('click', () => {
                WebApp.HapticFeedback.impactOccurred('light');
            });
        });
    </script>
</body>
</html>
